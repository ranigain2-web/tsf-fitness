name: CI

# TSF-001: real toolchain replacing the Day 0 stub. Every push and PR runs
# lint, typecheck, unit tests, and a production build, plus the Playwright
# offline smoke on the production build. Pushes to main also deploy the
# built app to GitHub Pages (Pages is configured with build_type=workflow;
# this workflow is its only build source) and then re-run the installability
# and offline checks against the DEPLOYED URL — the bar's measurement —
# with Lighthouse recorded alongside (Lighthouse 12.0.0 removed the PWA
# category; the Playwright offline checks are the blocking measurement,
# the Lighthouse run is informational).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run seed

  e2e:
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-deployed:
    # The bar's measurement, run against the live deployment after it
    # lands: the offline smoke suite must pass on the deployed URL, and a
    # Lighthouse report is recorded (non-blocking; the PWA category was
    # removed from Lighthouse in 12.0.0, so installability here is proven
    # by the Playwright manifest + offline assertions).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://ranigain2-web.github.io/tsf-fitness/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Locate Playwright Chromium for Lighthouse
        # Lighthouse drives its own Chrome via chrome-launcher, which needs
        # an explicit path (no system Chrome is guaranteed on runners).
        # The same Chromium this job just installed for Playwright is the
        # deterministic choice.
        run: echo "CHROME_PATH=$(ls "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | sort | tail -n 1)" >> "$GITHUB_ENV"
      - name: Offline smoke against the deployed app (with propagation retries)
        # deploy-pages returns before every edge node has the new content;
        # a brief 404/stale window must not redden the critical path.
        # Five attempts, twenty seconds apart, cover it.
        run: |
          for i in 1 2 3 4 5; do
            if npx playwright test; then exit 0; fi
            echo "attempt $i failed; waiting for Pages propagation..."
            sleep 20
          done
          echo "smoke failed against the deployed URL after 5 attempts"
          exit 1
      - name: Lighthouse 13 trend report (informational)
        # Lighthouse 12.0.0 removed the PWA category (PR #15455), so
        # installability here is proven by the blocking Playwright step
        # above and by the pinned Lighthouse 11 step below. This report
        # records perf/a11y/best-practices trends only. The step is
        # non-blocking by policy, but it must SHOW what happened: scores
        # print to the log and a missing report is stated, never silently
        # swallowed.
        continue-on-error: true
        run: |
          mkdir -p /tmp/lighthouse lighthouse-report
          npx lighthouse "$E2E_BASE_URL" \
            --chrome-flags="--headless=new --no-sandbox --remote-allow-origins=*" \
            --output=json --output=html \
            --output-path=/tmp/lighthouse/live || true
          if [ -f /tmp/lighthouse/live.report.json ]; then
            cp /tmp/lighthouse/live.report.* lighthouse-report/
            node -e "const r=require('/tmp/lighthouse/live.report.json'); const c=r.categories; console.log('Lighthouse:', JSON.stringify(Object.fromEntries(Object.entries(c).map(([k,v])=>[k,Math.round(v.score*100)]))))"
          else
            echo "lighthouse did not produce a report (recorded as missing; non-blocking)"
          fi
      - name: Lighthouse 11 PWA category (blocking — the bar's literal measurement)
        # The bar names Lighthouse "Install to home screen" on the deployed
        # URL. The PWA category was removed in Lighthouse 12.0.0; 11.7.1 is
        # the last release carrying it (the 11.x line ends there), so the
        # literal measurement runs pinned to that version and BLOCKS the
        # merge pipeline. Notes on the plumbing, all dry-run verified:
        # Lighthouse 11's printer does NOT mkdir the output directory, and
        # with a single --output plus an explicit --output-path it writes
        # to that exact raw path (no .report.json suffix is appended).
        # The binary is vendored at tools/lighthouse11 — its own
        # package-lock pins lighthouse@11.7.1 with integrity hashes, so
        # the blocking path makes no unpinned registry download. (An npm
        # alias was tried and rejected: it clobbers the root
        # lighthouse@13 bin and imports its advisories into the root
        # audit. The vendored tree's advisories are CI-only and never
        # shipped; recorded in the PR.)
        run: |
          npm ci --prefix tools/lighthouse11
          mkdir -p /tmp/lh11 lighthouse-report
          node tools/lighthouse11/node_modules/lighthouse/cli/index.js "$E2E_BASE_URL" \
            --only-categories=pwa \
            --chrome-flags="--headless=new --no-sandbox --remote-allow-origins=*" \
            --output=json \
            --output-path=/tmp/lh11/pwa.report.json
          cp /tmp/lh11/pwa.report.json lighthouse-report/
          node -e "const r=require('/tmp/lh11/pwa.report.json'); console.log('Lighthouse 11 PWA score:', r.categories.pwa.score); process.exit(r.categories.pwa.score===1?0:1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: warn
          retention-days: 7
