name: CI

# TSF-001: real toolchain replacing the Day 0 stub. Every push and PR runs
# lint, typecheck, unit tests, and a production build, plus the Playwright
# offline smoke on the production build. Pushes to main also deploy the
# built app to GitHub Pages (Pages is configured with build_type=workflow;
# this workflow is its only build source) and then re-run the installability
# and offline checks against the DEPLOYED URL — the bar's measurement —
# with Lighthouse recorded alongside (Lighthouse 12.0.0 removed the PWA
# category; the Playwright offline checks are the blocking measurement,
# the Lighthouse run is informational).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-deployed:
    # The bar's measurement, run against the live deployment after it
    # lands: the offline smoke suite must pass on the deployed URL, and a
    # Lighthouse report is recorded (non-blocking; the PWA category was
    # removed from Lighthouse in 12.0.0, so installability here is proven
    # by the Playwright manifest + offline assertions).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: https://ranigain2-web.github.io/tsf-fitness/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Offline smoke against the deployed app
        run: npx playwright test
      - name: Lighthouse against the deployed app (informational)
        # Lighthouse 12.0.0 removed the PWA category (PR #15455), so
        # installability here is proven by the blocking Playwright step
        # above; this report is recorded for trend-watching only.
        continue-on-error: true
        run: |
          mkdir -p lighthouse-report
          npx lighthouse "$E2E_BASE_URL" \
            --chrome-flags="--headless=new" \
            --output=json --output=html \
            --output-path=/tmp/lighthouse/live
          cp /tmp/lighthouse/live*.report.* lighthouse-report/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: ignore
          retention-days: 7
